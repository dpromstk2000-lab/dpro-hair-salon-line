name: STEP DPRO TUTORIAL HAIR R4 GUIDE CENTER V1.1 QA

on:
  push:
    branches: [main]
    paths:
      - "guide-center.js"
      - ".github/workflows/step-dpro-tutorial-hair-r4-guide-center.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Static R4 Guide Center contract check
        shell: python
        run: |
          import json, pathlib, subprocess
          g=pathlib.Path("guide-center.js").read_text(encoding="utf-8")
          assert "HAIR-R4-GUIDE-CENTER-V1.1-EXACT10-20260829" in g
          assert "R1_FIRST10_CONTRACT.json" in g
          assert "first10: 10" in g
          assert "first10: 15" not in g
          assert "resume-owner" in g
          assert "owner.html?tutorial=resume" in g
          assert "guide-center.html?tutorial=resume" in g
          assert "owner.html?tutorial=restart" in g
          subprocess.run(["node","--check","guide-center.js"],check=True)

          c=json.loads(pathlib.Path("CONTENT_PACKAGE.json").read_text(encoding="utf-8-sig"))
          assert c["package_id"]=="HAIR_CONTENT_PACKAGE_V1.0"
          assert len(c["guide_articles"])==34
          assert len(c["faqs"])==14
          assert len(set(x["category"] for x in c["guide_articles"]))==8

          f=json.loads(pathlib.Path("R1_FIRST10_CONTRACT.json").read_text(encoding="utf-8-sig"))
          assert f["first10_count"]==10 and len(f["steps"])==10
          assert [x["id"] for x in f["steps"]]==[f"F10-{i:02d}" for i in range(1,11)]
          assert all(x["route"]=="owner.html" for x in f["steps"][:9])
          assert f["steps"][9]["route"]=="guide-center.html"
          assert f["steps"][9]["cross_page"]["required"] is True

          h=pathlib.Path("guide-center.html").read_text(encoding="utf-8")
          assert 'id="guideSearch"' in h
          assert 'id="replayFirst10"' in h
          assert "tutorial-first10.js" in h
          assert "guide-center.js" in h

      - name: Wait for exact production R4 runtime URL
        shell: python
        run: |
          import time, urllib.request
          url="https://dpromstk2000-lab.github.io/dpro-hair-salon-line/guide-center.js?v=20260822-r4"
          marker="HAIR-R4-GUIDE-CENTER-V1.1-EXACT10-20260829"
          headers={
            "Cache-Control":"no-cache, no-store, max-age=0",
            "Pragma":"no-cache",
            "User-Agent":"DPRO-HAIR-R4-QA-V1.1"
          }
          for i in range(180):
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=15) as r:
                      body=r.read().decode("utf-8","replace")
                  live=marker in body
              except Exception as e:
                  print("poll",i,type(e).__name__,e)
                  live=False
              print("production_r4_gate",i,live)
              if live:
                  print("R4 exact production guide-center.js LIVE")
                  break
              time.sleep(4)
          else:
              raise SystemExit("R4 production guide-center.js did not become LIVE")

      - name: Install Playwright
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1 || npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Run exact-width R4 LIVE QA
        shell: bash
        env:
          B64_R4QA: 
        run: |
          python - <<'PY'
          import os,base64,gzip,pathlib
          pathlib.Path("r4qa.js").write_bytes(gzip.decompress(base64.b64decode(os.environ["B64_R4QA"])))
          PY
          node r4qa.js

      - name: Upload R4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_TUTORIAL_HAIR_R4_QA_EVIDENCE
          path: R4_QA_EVIDENCE.json
          if-no-files-found: warn
