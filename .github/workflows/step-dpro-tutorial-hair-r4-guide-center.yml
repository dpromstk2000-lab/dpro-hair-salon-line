              owner.write_text(after, encoding="utf-8", newline="\n")
              print("owner.html patched: +1 R4 bridge include")
          else:
              print("owner.html R4 bridge already present")

      - name: R4 static QA
        shell: python
        run: |
          from pathlib import Path
          import json
          import hashlib
          import re
          import subprocess

          EXPECTED_CONTENT_SHA256 = "7b931958aac74ab7406ee2efeb54e462243f4f32574462ab2da25f5bfa94f143"
          content_bytes = Path("CONTENT_PACKAGE.json").read_bytes()
          if hashlib.sha256(content_bytes).hexdigest() != EXPECTED_CONTENT_SHA256:
              raise SystemExit("FAIL: CONTENT_PACKAGE SHA256 changed")
          content = json.loads(content_bytes)

          articles = content.get("guide_articles") or []
          faqs = content.get("faqs") or []
          categories = {x.get("category") for x in articles}
          if len(categories) != 8 or len(articles) != 34 or len(faqs) != 14:
              raise SystemExit(f"FAIL: Guide counts {len(categories)}/{len(articles)}/{len(faqs)}")
          if len(content.get("first10") or []) != 15:
              raise SystemExit("FAIL: R3 FIRST10 count changed")

          html = Path("guide-center.html").read_text(encoding="utf-8")
          js = Path("guide-center.js").read_text(encoding="utf-8")
          css = Path("guide-center.css").read_text(encoding="utf-8")
          meta = Path("guide-targets.js").read_text(encoding="utf-8")
          bridge = Path("r4-guide-bridge.js").read_text(encoding="utf-8")
          owner = Path("owner.html").read_text(encoding="utf-8")

          for token in [
              'id="guideSearch"', 'id="categoryFilters"', 'id="articleList"',
              'id="articleDetailSection"', 'id="faqList"', 'id="replayFirst10"'
          ]:
              if token not in html:
                  raise SystemExit(f"FAIL: Guide UI token missing {token}")

          for forbidden in ["system-check","demo_prepare","Worker/DB/API internal inspection"]:
              rendered_source = html + "\n" + js + "\n" + css
              if forbidden in rendered_source:
                  raise SystemExit(f"FAIL: customer Guide source contains {forbidden}")

          for mutation in ["adminPost(", "saveSettings(", "saveMenu(", "saveStaff(", "executeCsv(", "updateReservationStatus(", "updateFollow("]:
              if mutation in (js + "\n" + bridge):
                  raise SystemExit(f"FAIL: R4 mutation call detected {mutation}")

          if owner.count('r4-guide-bridge.js?v=20260822-r4') != 1:
              raise SystemExit("FAIL: owner R4 bridge include count")
          if owner.count('tutorial-first10.js?v=20260822-r3') != 1:
              raise SystemExit("FAIL: R3 FIRST10 include changed")

          # R4 content copy must stay runtime-loaded from CONTENT_PACKAGE.json.
          if 'fetch("CONTENT_PACKAGE.json"' not in js:
              raise SystemExit("FAIL: Guide Center is not bound to CONTENT_PACKAGE.json")
          sample_titles = [articles[0]["title"], articles[-1]["title"], faqs[0]["q"], faqs[-1]["q"]]
          for sample in sample_titles:
              if sample in html or sample in js:
                  raise SystemExit("FAIL: article/FAQ copy duplicated outside CONTENT_PACKAGE.json")

          subprocess.run(["node","--check","guide-center.js"],check=True)
          subprocess.run(["node","--check","guide-targets.js"],check=True)
          subprocess.run(["node","--check","r4-guide-bridge.js"],check=True)

          print("R4 static QA: PASS")
          print("Guide Center: 8 categories / 34 articles / FAQ14")
          print("R3 FIRST10: preserved 15 cards")
          print("mutation zero: PASS")
          print("internal support exclusion: PASS")

      - name: Verify intended diff only
        shell: bash
        run: |
          set -euo pipefail
          echo "Changed files:"
          git status --short

          git diff --check

          unexpected="$(git status --short | awk '{print $2}' | grep -Ev '^(owner\.html|guide-center\.html|guide-center\.css|guide-center\.js|guide-targets\.js|r4-guide-bridge\.js)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "BLOCK: unexpected files"
            echo "$unexpected"
            exit 1
          fi

          owner_diff="$(git diff --numstat -- owner.html)"
          if [ -n "$owner_diff" ]; then
            add="$(echo "$owner_diff" | awk '{print $1}')"
            del="$(echo "$owner_diff" | awk '{print $2}')"
            if [ "$add" != "1" ] || [ "$del" != "0" ]; then
              echo "BLOCK: owner.html must be +1 / -0 only"
              echo "$owner_diff"
              exit 1
            fi
          fi

          echo "R4 intended diff QA: PASS"

