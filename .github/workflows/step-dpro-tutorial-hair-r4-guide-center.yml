        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add owner.html guide-center.html guide-center.css guide-center.js guide-targets.js r4-guide-bridge.js

