name: STEP DPRO TUTORIAL HAIR R4 GUIDE CENTER

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/step-dpro-tutorial-hair-r4-guide-center.yml'

permissions:
  contents: write

concurrency:
  group: dpro-tutorial-hair-r4-guide-center
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard R3 FINAL LOCK
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import subprocess

          EXPECTED_COMMIT = "05bbcf568fb934c8eccfa585f72144a504850c01"
          EXPECTED_OWNER_BLOB = "a8e7c48eb9be6ab0103a7f2b0e8308503e4b3900"
          EXPECTED_TUTORIAL_JS_BLOB = "94239fd25749bf59bd7e45347fe42b25799ddf26"
          EXPECTED_TUTORIAL_CSS_BLOB = "7a6d3cab38a88ba9fdd11f2bd86f9527ed56e6c4"
          EXPECTED_CONTENT_SHA256 = "7b931958aac74ab7406ee2efeb54e462243f4f32574462ab2da25f5bfa94f143"
          WORKFLOW = ".github/workflows/step-dpro-tutorial-hair-r4-guide-center.yml"
          R4_RUNTIME = {
              "owner.html",
              "guide-center.html",
              "guide-center.css",
              "guide-center.js",
              "guide-targets.js",
              "r4-guide-bridge.js",
          }

          subprocess.run(["git","merge-base","--is-ancestor",EXPECTED_COMMIT,"HEAD"],check=True)

          required = ["owner.html","tutorial-first10.js","tutorial-first10.css","CONTENT_PACKAGE.json"]
          missing = [x for x in required if not Path(x).exists()]
          if missing:
              raise SystemExit(f"BLOCK: R3 FINAL LOCK file missing: {missing}")

          actual_owner = subprocess.check_output(["git","hash-object","owner.html"],text=True).strip()
          actual_tut_js = subprocess.check_output(["git","hash-object","tutorial-first10.js"],text=True).strip()
          actual_tut_css = subprocess.check_output(["git","hash-object","tutorial-first10.css"],text=True).strip()
          actual_content = hashlib.sha256(Path("CONTENT_PACKAGE.json").read_bytes()).hexdigest()

          if actual_tut_js != EXPECTED_TUTORIAL_JS_BLOB:
              raise SystemExit(f"BLOCK: tutorial-first10.js drift {actual_tut_js}")
          if actual_tut_css != EXPECTED_TUTORIAL_CSS_BLOB:
              raise SystemExit(f"BLOCK: tutorial-first10.css drift {actual_tut_css}")
          if actual_content != EXPECTED_CONTENT_SHA256:
              raise SystemExit(f"BLOCK: CONTENT_PACKAGE drift {actual_content}")

          owner_text = Path("owner.html").read_text(encoding="utf-8")
          already = "r4-guide-bridge.js" in owner_text

          changed = set(filter(None, subprocess.check_output(
              ["git","diff","--name-only",f"{EXPECTED_COMMIT}..HEAD"],text=True
          ).splitlines()))

          if not already:
              if actual_owner != EXPECTED_OWNER_BLOB:
                  raise SystemExit(f"BLOCK: owner.html drift {actual_owner}")
              unexpected = changed - {WORKFLOW}
              if unexpected:
                  raise SystemExit(f"BLOCK: source drift since R3 FINAL LOCK: {sorted(unexpected)}")
          else:
              unexpected = changed - ({WORKFLOW} | R4_RUNTIME)
              if unexpected:
                  raise SystemExit(f"BLOCK: unexpected post-R4 drift: {sorted(unexpected)}")

          if 'tutorial-first10.js?v=20260822-r3' not in owner_text:
              raise SystemExit("BLOCK: R3 FIRST10 include not found")
          if 'CONTENT_PACKAGE.json' not in subprocess.check_output(["git","ls-files"],text=True):
              raise SystemExit("BLOCK: CONTENT_PACKAGE.json is not tracked")

          print("R3 FINAL LOCK guard: PASS")
          print("R3 tutorial JS/CSS: LOCKED")
          print("CONTENT_PACKAGE SHA256:", actual_content)
          print("R4 already applied:", already)

