name: STEP DPRO TUTORIAL HAIR R5 PRINT MANUALS V1.1 QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/step-dpro-tutorial-hair-r5-print-manuals.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r5-manuals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify accepted R4 and First10 exact10
        shell: python
        run: |
          import json, pathlib, subprocess
          c=json.loads(pathlib.Path('R1_FIRST10_CONTRACT.json').read_text(encoding='utf-8-sig'))
          assert c['first10_count']==10 and len(c['steps'])==10
          assert [x['id'] for x in c['steps']]==[f'F10-{i:02d}' for i in range(1,11)]
          assert c['steps'][9]['route']=='guide-center.html'
          assert c['steps'][9]['cross_page']['required'] is True
          g=pathlib.Path('guide-center.js').read_text(encoding='utf-8')
          assert 'HAIR-R4-GUIDE-CENTER-V1.1-EXACT10-20260829' in g
          assert 'first10: 15' not in g
          t=pathlib.Path('tutorial-first10.js').read_text(encoding='utf-8')
          assert 'HAIR-R3-FIRST10-V1.1-STANDARD10-20260828' in t
          print('R4 ACCEPTED BASELINE / FIRST10 EXACT10: PASS')

      - name: Install capture and PDF dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fonts-noto-cjk >/dev/null
          python -m pip install --quiet reportlab pillow qrcode opencv-python-headless
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1 || npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Capture current LIVE safe UI
        shell: bash
        env:
          B64_CAPTURE: 
        run: |
          python - <<'PY'
          import os,base64,gzip,pathlib
          pathlib.Path('r5_capture.js').write_bytes(gzip.decompress(base64.b64decode(os.environ['B64_CAPTURE'])))
          PY
          node r5_capture.js

      - name: Build A4 Quick Start and Detailed Manual - QR cache-safe
        shell: bash
        env:
          B64_MANUAL: 
        run: |
          python - <<'PY'
          import os,base64,gzip,pathlib
          pathlib.Path('r5_build_manuals.py').write_bytes(gzip.decompress(base64.b64decode(os.environ['B64_MANUAL'])))
          PY
          python r5_build_manuals.py

      - name: Render every PDF page and decode every QR
        shell: bash
        env:
          B64_QA: 
        run: |
          python - <<'PY'
          import os,base64,gzip,pathlib
          pathlib.Path('r5_pdf_qr_qa.py').write_bytes(gzip.decompress(base64.b64decode(os.environ['B64_QA'])))
          PY
          python r5_pdf_qr_qa.py

      - name: Verify expected R5 deliverables
        shell: python
        run: |
          import pathlib, json
          out=pathlib.Path('r5_output')
          required=[
            'DPRO_TUTORIAL_HAIR_QUICK_START_V1.0.pdf',
            'DPRO_TUTORIAL_HAIR_QUICK_START_V1.0.png',
            'DPRO_TUTORIAL_HAIR_DETAILED_MANUAL_V1.0.pdf',
            *[f'DPRO_TUTORIAL_HAIR_DETAILED_MANUAL_V1.0_PAGE_{i:02d}.png' for i in range(1,7)],
            'R5_BUILD_INFO.json','R5_PDF_VISUAL_PRECHECK.json','R5_QR_QA.json'
          ]
          for n in required:
            assert (out/n).is_file(), n
          cap=json.loads(pathlib.Path('r5_capture/R5_CAPTURE_QA.json').read_text())
          assert cap['pass'] and cap['writes']==[] and cap['pageerrors']==[] and cap['console_errors']==[]
          qr=json.loads((out/'R5_QR_QA.json').read_text())
          assert qr['pass']
          print('R5 BUILD / RENDER / QR PRECHECK: PASS')

      - name: Copy capture QA and screenshots into evidence artifact
        shell: bash
        run: |
          cp r5_capture/R5_CAPTURE_QA.json r5_output/
          cp r5_capture/LIVE_*.png r5_output/

      - name: Upload R5 manuals and evidence
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_TUTORIAL_HAIR_R5_MANUALS_EVIDENCE
          path: r5_output/
          if-no-files-found: error
