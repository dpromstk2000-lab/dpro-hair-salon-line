      - name: Write final release evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cat > "$EVIDENCE_DIR/HAIR_PRODUCT_READY_FINAL_V2.5_20260822.txt" <<EOF
          DPRO PRODUCT READY #10 HAIR
          FINAL LIVE QA V2.5
          Date: 2026-08-22
          Worker: $EXPECTED_WORKER_VERSION
          Adapter: DPRO-CONTROL-ADAPTER-1.0
          Staff server scope: VERIFIED
          Critical operation audit: VERIFIED
          CORS QA origin: VERIFIED
          GitHub Pages Product READY source: VERIFIED
          PC/390/320/iPad browser QA: VERIFIED
          Result: LIVE QA COMPLETE
          EOF
          sha256sum "$EVIDENCE_DIR"/* > "$EVIDENCE_DIR/SHA256SUMS.txt"

      - name: Commit evidence and remove temporary Product READY workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Product READY"
          git config user.email "actions@users.noreply.github.com"
          rm -f             .github/workflows/HAIR-PRODUCT-READY-V2.yml             .github/workflows/HAIR-PRODUCT-READY-V2.1.yml             .github/workflows/HAIR-PRODUCT-READY-V2.2.yml             .github/workflows/HAIR-PRODUCT-READY-V2.3.yml             "$WORKFLOW_FILE"
          git add -A "$EVIDENCE_DIR" .github/workflows staff.html config.js
          if ! git diff --cached --quiet; then
            git commit -m "HAIR Product READY final live QA evidence"
            git push origin main
          fi
          echo "HAIR PRODUCT READY V2.5 FINAL LIVE QA COMPLETE"
