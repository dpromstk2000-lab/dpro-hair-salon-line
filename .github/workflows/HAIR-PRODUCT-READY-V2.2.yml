      - name: Static integration QA
        shell: bash
        run: |
          set -euo pipefail
          node --check config.js
          python - <<'PY'
          from pathlib import Path
          import re
          staff=Path('staff.html').read_text(encoding='utf-8')
          config=Path('config.js').read_text(encoding='utf-8')
          ids=re.findall(r'\bid="([^"]+)"',staff.split('<script',1)[0])
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, dup
          assert 'HAIR-PRODUCT-READY-STAFF-SCOPE-20260822' in staff
          assert 'C().admin.' not in staff
          assert 'C().api.adminGet(' not in staff and 'C().api.adminPost(' not in staff
          assert 'C().api.staffGet(' in staff and 'C().api.staffPost(' in staff
          assert 'issueStaffSession' in staff
          assert '{staff:true}' in staff
          assert 'inputmode="text"' in staff
          assert '接続解除' in staff
          assert 'hasStaffPermission' in staff
          assert '@media(max-width:360px)' in staff
          assert 'HAIR-PRODUCT-READY-2-WORKER-20260822' in config
          assert '/api/auth/staff-session' in config
          assert 'staffGet' in config and 'staffPost' in config
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',staff,re.S|re.I)
          Path('/tmp/staff-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('Static integration PASS')
          PY
          node --check /tmp/staff-inline.js

