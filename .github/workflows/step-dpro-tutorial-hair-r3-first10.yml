          for name, payload in FILES.items():
              Path(name).write_bytes(base64.b64decode("".join(payload.split())))

          owner = Path("owner.html")
          before = owner.read_text(encoding="utf-8")

          css_tag = '<link rel="stylesheet" href="tutorial-first10.css?v=20260822-r3">'
          js_tag = '<script src="tutorial-first10.js?v=20260822-r3"></script>'

          if css_tag not in before:
              if "</head>" not in before:
                  raise SystemExit("BLOCK: </head> not found")
              after = before.replace("</head>", f"  {css_tag}\n</head>", 1)
          else:
              after = before

          if js_tag not in after:
              if "</body>" not in after:
                  raise SystemExit("BLOCK: </body> not found")
              after = after.replace("</body>", f"{js_tag}\n</body>", 1)

          owner.write_text(after, encoding="utf-8", newline="\n")

          restored = after.replace(f"  {css_tag}\n", "", 1).replace(f"{js_tag}\n", "", 1)
          if css_tag not in before and js_tag not in before and restored != before:
              raise SystemExit("BLOCK: owner.html changed beyond additive includes")

          print("R3 assets written and owner include patch applied")

      - name: R3 static QA
        shell: bash
        run: |
          set -euo pipefail
          node --check tutorial-first10.js
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          EXPECTED_CONTENT_SHA = "7b931958aac74ab7406ee2efeb54e462243f4f32574462ab2da25f5bfa94f143"
          EXPECTED_SOURCE_COMMIT = "682b48772f5859199ae98cf87ef72d7e43bf389c"

          owner = Path("owner.html").read_text(encoding="utf-8")
          js = Path("tutorial-first10.js").read_text(encoding="utf-8")
          css = Path("tutorial-first10.css").read_text(encoding="utf-8")
          content_bytes = Path("CONTENT_PACKAGE.json").read_bytes()
          data = json.loads(content_bytes)

          assert hashlib.sha256(content_bytes).hexdigest() == EXPECTED_CONTENT_SHA
          assert data["source_lock"]["commit"] == EXPECTED_SOURCE_COMMIT
          assert len(data["first10"]) == 15
          assert [x["id"] for x in data["first10"]] == [f"F10-{i:02d}" for i in range(1,16)]
          assert owner.count("tutorial-first10.css?v=20260822-r3") == 1
          assert owner.count("tutorial-first10.js?v=20260822-r3") == 1

          customer_text = json.dumps(data["first10"], ensure_ascii=False)
          for forbidden in ("system-check", "demo_prepare", "Worker/DB/API internal inspection"):
              assert forbidden not in customer_text

          assert js.count("fetch(") == 1
          for token in (
              "adminPost(", "XMLHttpRequest", ".submit()", "requestSubmit(",
              "saveSettings(", "saveManual(", "updateReservationStatus(", "updateFollow(", "updateProposal("
          ):
              assert token not in js, token

          assert "#dproTutorialLauncher" in js
          assert "#dproGuideCenterLink" in js
          assert "dpro-tutorial-shield" in css
          assert "pointer-events:auto" in css.replace(" ", "")
          assert "max-width:760px" in css
          assert 'event.key === "Escape"' in js
          assert 'event.key === "ArrowRight"' in js
          assert 'event.key === "ArrowLeft"' in js

          print("R3 static QA: PASS")
          PY

      - name: Commit R3 runtime files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owner.html CONTENT_PACKAGE.json tutorial-first10.css tutorial-first10.js
          if git diff --cached --quiet; then
            echo "No R3 changes to commit."
            exit 0
          fi
          git commit -m "Add HAIR R3 in-app FIRST10 tutorial"
          git push
