name: STEP DPRO TUTORIAL HAIR R3 FIRST10 V1.1 QA
# Harness V1.8: mobile admin overflow fix + guide settle + zero console errors

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/step-dpro-tutorial-hair-r3-first10.yml'

permissions:
  contents: read

concurrency:
  group: dpro-tutorial-hair-r3-first10-v11-qa
  cancel-in-progress: false

jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Static R3 contract check
        shell: python
        run: |
          import json, pathlib, subprocess
          c=json.loads(pathlib.Path('R1_FIRST10_CONTRACT.json').read_text(encoding='utf-8-sig'))
          assert c['first10_count']==10 and len(c['steps'])==10
          assert [s['id'] for s in c['steps']]==[f'F10-{i:02d}' for i in range(1,11)]
          assert c['steps'][-1]['route']=='guide-center.html' and c['steps'][-1]['cross_page']['required'] is True
          text=pathlib.Path('tutorial-first10.js').read_text(encoding='utf-8')
          assert 'HAIR-R3-FIRST10-V1.1-STANDARD10-20260828' in text
          assert 'data-role="close"' in text and 'dpro_hair_tutorial_first10_v2' in text
          assert 'Persist synchronously before deferred card rendering' in text
          assert 'Keep Back navigation equally durable' in text
          assert 'Render token prevents stale deferred callbacks' in text
          assert 'const renderToken = ++state.renderToken' in text
          assert 'state.renderToken === renderToken && state.index === stepIndex' in text
          subprocess.run(['node','--check','tutorial-first10.js'],check=True)
          bridge=pathlib.Path('r4-guide-bridge.js').read_text(encoding='utf-8')
          assert 'HAIR-R4-GUIDE-BRIDGE-V1.2-RESTART-SINGLE-OWNER-20260829' in bridge
          assert 'R3 restart ownership: tutorial-first10.js is the only handler' in bridge
          assert 'window.DPRO_TUTORIAL_HAIR.replay()' not in bridge
          assert 'url.searchParams.get("tutorial")==="restart"' not in bridge
          css=pathlib.Path('tutorial-first10.css').read_text(encoding='utf-8')
          assert 'R3 MOBILE OVERFLOW FIX V1.1' in css
          assert 'body.hair-operation-owner #topAdminCodeForm' in css
          assert 'body.hair-operation-owner #topAdminConnectionStatus' in css
          assert 'width:0!important' in css
          subprocess.run(['node','--check','r4-guide-bridge.js'],check=True)

      - name: Wait for exact production R3 runtime URLs
        shell: python
        run: |
          import time, urllib.request
          checks=[
            ('https://dpromstk2000-lab.github.io/dpro-hair-salon-line/tutorial-first10.js?v=20260822-r3','Render token prevents stale deferred callbacks'),
            ('https://dpromstk2000-lab.github.io/dpro-hair-salon-line/tutorial-first10.js?v=20260828-r3v11','Render token prevents stale deferred callbacks'),
            ('https://dpromstk2000-lab.github.io/dpro-hair-salon-line/r4-guide-bridge.js?v=20260822-r4','R3 restart ownership: tutorial-first10.js is the only handler'),
            ('https://dpromstk2000-lab.github.io/dpro-hair-salon-line/tutorial-first10.css?v=20260822-r3','R3 MOBILE OVERFLOW FIX V1.1'),
            ('https://dpromstk2000-lab.github.io/dpro-hair-salon-line/tutorial-first10.css?v=20260828-r3v11','R3 MOBILE OVERFLOW FIX V1.1'),
          ]
          headers={
            'Cache-Control':'no-cache, no-store, max-age=0',
            'Pragma':'no-cache',
            'User-Agent':'DPRO-HAIR-R3-QA-V1.8'
          }
          for i in range(180):
              states=[]
              for url,marker in checks:
                  try:
                      req=urllib.request.Request(url,headers=headers)
                      with urllib.request.urlopen(req,timeout=15) as r:
                          body=r.read().decode('utf-8','replace')
                      states.append(marker in body)
                  except Exception as e:
                      print('poll',i,url,type(e).__name__,e)
                      states.append(False)
              print('production_runtime_gate',i,states)
              if all(states):
                  print('R3 exact production script URLs LIVE')
                  break
              time.sleep(4)
          else:
              raise SystemExit('R3 exact production script URLs did not become LIVE')

      - name: Install Playwright
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1 || npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Run exact-width R3 LIVE QA
        shell: bash
        env:
          B64_R3QA: 
        run: |
          python - <<'PY'
          import os,base64,gzip,pathlib
          pathlib.Path('r3qa.js').write_bytes(gzip.decompress(base64.b64decode(os.environ['B64_R3QA'])))
          PY
          node r3qa.js

      - name: Upload R3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_TUTORIAL_HAIR_R3_QA_EVIDENCE
          path: R3_QA_EVIDENCE.json
          if-no-files-found: warn
