name: STEP DPRO TUTORIAL HAIR R3 FIRST10

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/step-dpro-tutorial-hair-r3-first10.yml'

permissions:
  contents: write

concurrency:
  group: dpro-tutorial-hair-r3-first10
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard R2 FINAL LOCK baseline
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          EXPECTED_COMMIT = "682b48772f5859199ae98cf87ef72d7e43bf389c"
          EXPECTED_OWNER_BLOB = "58268b17d45e21efc1ac3dbc2ef9236f4d3a0a76"
          WORKFLOW = ".github/workflows/step-dpro-tutorial-hair-r3-first10.yml"
          RUNTIME = {"owner.html", "CONTENT_PACKAGE.json", "tutorial-first10.css", "tutorial-first10.js"}

          subprocess.run(["git", "merge-base", "--is-ancestor", EXPECTED_COMMIT, "HEAD"], check=True)

          owner = Path("owner.html")
          if not owner.exists():
              raise SystemExit("BLOCK: owner.html not found")

          text = owner.read_text(encoding="utf-8")
          already = "tutorial-first10.css" in text or "tutorial-first10.js" in text
          actual_blob = subprocess.check_output(["git", "hash-object", "owner.html"], text=True).strip()

          changed = set(filter(None, subprocess.check_output(
              ["git", "diff", "--name-only", f"{EXPECTED_COMMIT}..HEAD"], text=True
          ).splitlines()))

          if not already:
              if actual_blob != EXPECTED_OWNER_BLOB:
                  raise SystemExit(f"BLOCK: owner.html blob drift {actual_blob}")
              unexpected = changed - {WORKFLOW}
              if unexpected:
                  raise SystemExit(f"BLOCK: source drift since R2 FINAL LOCK: {sorted(unexpected)}")
          else:
              unexpected = changed - ({WORKFLOW} | RUNTIME)
              if unexpected:
                  raise SystemExit(f"BLOCK: unexpected post-R3 drift: {sorted(unexpected)}")

          required = [
              'id="topAdminCodeArea"', 'id="topAdminCodeClear"',
              'data-view="today"', 'id="todayStats"', 'id="statusPipeline"',
              'id="todayReservationTable"', 'id="attentionList"', 'data-action="open-manual"',
              'data-view="reservations"', 'id="reservationStatusFilter"', 'id="reservationPageList"',
              'data-view="customers"', 'id="customerSearchInput"', 'id="customerDetailCard"',
              'data-view="carte"', 'id="carteContent"', 'id="carteAddRecord"',
              'class="sidefoot__links"', 'data-view="follow"', 'id="followTaskList"', 'id="proposalList"'
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(f"BLOCK: R2 target binding missing: {missing}")

          print("R2 FINAL LOCK baseline guard: PASS")
          print("owner blob:", actual_blob)
          print("already applied:", already)

