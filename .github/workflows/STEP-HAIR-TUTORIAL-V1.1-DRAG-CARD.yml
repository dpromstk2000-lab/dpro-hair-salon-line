name: DPRO TUTORIAL HAIR V1.1 Drag Card

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/STEP-HAIR-TUTORIAL-V1.1-DRAG-CARD.yml"

permissions:
  contents: write

concurrency:
  group: dpro-tutorial-hair-v11-drag-card
  cancel-in-progress: false

env:
  WORKFLOW_FILE: .github/workflows/STEP-HAIR-TUTORIAL-V1.1-DRAG-CARD.yml
  EXPECTED_JS_BLOB: 94239fd25749bf59bd7e45347fe42b25799ddf26
  EXPECTED_CSS_BLOB: 7a6d3cab38a88ba9fdd11f2bd86f9527ed56e6c4
  PAGE_BASE: https://dpromstk2000-lab.github.io/dpro-hair-salon-line

jobs:
  apply-drag-card:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact tutorial sources
        shell: bash
        run: |
          set -euo pipefail
          test -f tutorial-first10.js
          test -f tutorial-first10.css
          JS_BLOB="$(git hash-object tutorial-first10.js)"
          CSS_BLOB="$(git hash-object tutorial-first10.css)"
          echo "tutorial-first10.js blob: $JS_BLOB"
          echo "tutorial-first10.css blob: $CSS_BLOB"
          test "$JS_BLOB" = "$EXPECTED_JS_BLOB"
          test "$CSS_BLOB" = "$EXPECTED_CSS_BLOB"
          grep -q 'HAIR-R3-FIRST10-V1.0-20260822' tutorial-first10.js
          ! grep -q 'HAIR-R3-FIRST10-V1.1-DRAG-CARD-20260824' tutorial-first10.js

      - name: Apply draggable First10 card V1.1
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/apply_drag_card.py
          python /tmp/apply_drag_card.py

      - name: Static regression QA
        shell: bash
        run: |
          set -euo pipefail
          node --check tutorial-first10.js
          git diff --check
          grep -q 'HAIR-R3-FIRST10-V1.1-DRAG-CARD-20260824' tutorial-first10.js
          grep -q 'data-drag-handle' tutorial-first10.js
          grep -q 'setPointerCapture' tutorial-first10.js
          grep -q 'clampDraggedCard' tutorial-first10.js
          grep -q 'manuallyPlaced' tutorial-first10.js
          grep -q 'touch-action:none' tutorial-first10.css
          grep -q 'cursor:grab' tutorial-first10.css
          grep -q 'TutorialのNext/Back操作だけでは業務データを変更しません' CONTENT_PACKAGE.json
          CHANGED="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$CHANGED" = "tutorial-first10.css tutorial-first10.js "
          echo "HAIR DRAG CARD static QA PASS"

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Tutorial"
          git config user.email "actions@users.noreply.github.com"
          git add tutorial-first10.js tutorial-first10.css
          git rm "$WORKFLOW_FILE"
          git commit -m "DPRO TUTORIAL HAIR V1.1 draggable card"
          git push origin main

      - name: GitHub Pages source propagation check
        shell: bash
        run: |
          set -euo pipefail
          PASS=0
          for i in $(seq 1 24); do
            TS="$(date +%s)"
            JS="$(curl -fsSL --retry 2 --max-time 25 "${PAGE_BASE}/tutorial-first10.js?drag_v11=${TS}_${i}" || true)"
            CSS="$(curl -fsSL --retry 2 --max-time 25 "${PAGE_BASE}/tutorial-first10.css?drag_v11=${TS}_${i}" || true)"
            if printf '%s' "$JS" | grep -q 'HAIR-R3-FIRST10-V1.1-DRAG-CARD-20260824' && printf '%s' "$CSS" | grep -q 'R3 FIRST10 V1.1 DRAG CARD'; then
              PASS=1
              echo "GitHub Pages drag-card source PASS on attempt $i"
              break
            fi
            sleep 10
          done
          test "$PASS" = "1"
