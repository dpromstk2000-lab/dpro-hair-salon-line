      - name: Local four-size regression before commit
        shell: bash
        run: |
          set -euo pipefail
          # Worker CORS explicitly allows http://127.0.0.1:5500.
          # The previous V2.1 QA used :4173, so customer pages (which call Worker
          # immediately on load) produced browser CORS console errors.
          python3 -m http.server 5500 >/tmp/hair-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID || true' EXIT
          sleep 1
          PAGE_BASE=http://127.0.0.1:5500 EVIDENCE_DIR=/tmp/hair-local-evidence python /tmp/live_browser_qa.py
          kill $HTTP_PID || true
          trap - EXIT

      - name: Commit Product READY Staff and Config patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Product READY"
          git config user.email "actions@users.noreply.github.com"
          git add staff.html config.js
          if ! git diff --cached --quiet; then
            git commit -m "HAIR Product READY V2 enforce Staff permissions and Worker alignment"
            git push origin main
          fi
          echo "PATCH_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Request GitHub Pages rebuild and wait for V2 public source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pages/builds" -X POST >/tmp/pages-build.json 2>/tmp/pages-build.err || true
          READY=0
          for i in $(seq 1 36); do
            TS="$(date +%s)"
            STAFF="$(curl -fsSL --retry 2 --max-time 20 "${PAGE_BASE}/staff.html?ready_check=${TS}" || true)"
            CONFIG="$(curl -fsSL --retry 2 --max-time 20 "${PAGE_BASE}/config.js?ready_check=${TS}" || true)"
            if printf '%s' "$STAFF" | grep -q 'HAIR-PRODUCT-READY-STAFF-SCOPE-20260822' && printf '%s' "$CONFIG" | grep -q "$EXPECTED_WORKER_VERSION"; then
              READY=1
              break
            fi
            sleep 10
          done
          test "$READY" = "1"
          echo "GitHub Pages V2 source PASS"

