name: HAIR PRODUCT READY V2.3 Deploy and Live QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/HAIR-PRODUCT-READY-V2.3.yml"

permissions:
  contents: write
  pages: write
  actions: read

concurrency:
  group: hair-product-ready-v2
  cancel-in-progress: false

env:
  WORKFLOW_FILE: .github/workflows/HAIR-PRODUCT-READY-V2.3.yml
  OLD_WORKFLOW_FILE_V2: .github/workflows/HAIR-PRODUCT-READY-V2.yml
  OLD_WORKFLOW_FILE_V21: .github/workflows/HAIR-PRODUCT-READY-V2.1.yml
  OLD_WORKFLOW_FILE_V22: .github/workflows/HAIR-PRODUCT-READY-V2.2.yml
  WORKER_BASE: https://dpro-hair-salon-line-api.dpromstk2000.workers.dev
  PAGE_BASE: https://dpromstk2000-lab.github.io/dpro-hair-salon-line
  EXPECTED_WORKER_VERSION: HAIR-PRODUCT-READY-2.1-WORKER-20260822
  EXPECTED_STAFF_BLOB: 523b6bd2347eda47c5e56879e060c5da30eb8b45
  EXPECTED_CONFIG_BLOB: 0b2f571cee2a15ec6796b59782615ab80e8d1bde
  EVIDENCE_DIR: dpro-product-ready/hair/evidence

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current HAIR main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Preflight Cloudflare Worker V2 with browser headers
        shell: bash
        run: |
          set -euo pipefail
          BODY=/tmp/hair-worker-preflight.json
          STATUS=""
          for i in 1 2 3 4 5; do
            TS="$(date +%s)"
            STATUS="$(curl -sS -L -o "$BODY" -w "%{http_code}" --max-time 30 \
              -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0.0.0 Safari/537.36 DPRO-Hair-Product-Ready/2.1" \
              -H "Accept: application/json" \
              -H "Cache-Control: no-cache" \
              -H "Origin: https://dpromstk2000-lab.github.io" \
              -H "Referer: https://dpromstk2000-lab.github.io/dpro-hair-salon-line/" \
              "${WORKER_BASE}/api/health?shop_code=dpro_hair_demo&preflight_v21=${TS}_${i}" || true)"
            echo "Preflight attempt ${i}/5 -> HTTP ${STATUS}"
            if [ -s "$BODY" ]; then
              head -c 1200 "$BODY" || true
              echo
            fi
            if [ "$STATUS" = "200" ]; then
              break
            fi
            sleep 3
          done
          test "$STATUS" = "200"
          python - <<'PY'
          import json, os
          with open('/tmp/hair-worker-preflight.json', encoding='utf-8') as f:
              data=json.load(f)
          actual=data.get('version')
          expected=os.environ['EXPECTED_WORKER_VERSION']
          if actual != expected:
              raise SystemExit(f'Cloudflare Worker must be V2: expected {expected}, got {actual}')
          print('Worker preflight PASS:', actual)
          PY
          ACAO="$(curl -sS -D - -o /dev/null --max-time 30 \
            -H 'Origin: http://127.0.0.1:5500' \
            -H 'Cache-Control: no-cache' \
            "${WORKER_BASE}/api/public/config?shop_code=dpro_hair_demo&cors_probe=$(date +%s)" \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="access-control-allow-origin"{print $2}' | tail -1)"
          echo "CORS probe ACAO=${ACAO}"
          test "$ACAO" = "http://127.0.0.1:5500"

      - name: Guard current source and apply Staff scope plus Config V2
        shell: bash
        run: |
          set -euo pipefail
          STAFF_BLOB="$(git hash-object staff.html)"
          CONFIG_BLOB="$(git hash-object config.js)"
          if ! grep -q 'HAIR-PRODUCT-READY-STAFF-SCOPE-20260822' staff.html; then
            test "$STAFF_BLOB" = "$EXPECTED_STAFF_BLOB"
          fi
          if ! grep -q 'HAIR-PRODUCT-READY-2.1-WORKER-20260822' config.js; then
            test "$CONFIG_BLOB" = "$EXPECTED_CONFIG_BLOB"
          fi
          cat > /tmp/patch_staff.b64 <<'PATCH_STAFF_B64'
