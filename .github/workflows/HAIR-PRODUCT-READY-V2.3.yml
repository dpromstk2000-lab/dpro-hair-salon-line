      - name: Live PC 390 320 iPad browser QA
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/live_browser_qa.py

      - name: Write release evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "DPRO HAIR PRODUCT READY V2"
            echo "DATE=2026-08-22"
            echo "PATCH_COMMIT=${PATCH_COMMIT}"
            echo "WORKER_VERSION=${EXPECTED_WORKER_VERSION}"
            echo "STAFF_BLOB=$(git hash-object staff.html)"
            echo "CONFIG_BLOB=$(git hash-object config.js)"
            echo "WORKER_URL=${WORKER_BASE}"
            echo "PAGE_URL=${PAGE_BASE}"
          } > "$EVIDENCE_DIR/HAIR_PRODUCT_READY_DEPLOYMENT_20260822.txt"
          sha256sum "$EVIDENCE_DIR"/* > "$EVIDENCE_DIR/SHA256SUMS.txt"

      - name: Finalize evidence and self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$WORKFLOW_FILE" "$OLD_WORKFLOW_FILE_V2" "$OLD_WORKFLOW_FILE_V21" "$OLD_WORKFLOW_FILE_V22"
          git add -A "$EVIDENCE_DIR" "$WORKFLOW_FILE" "$OLD_WORKFLOW_FILE_V2" "$OLD_WORKFLOW_FILE_V21" "$OLD_WORKFLOW_FILE_V22" staff.html config.js
          if ! git diff --cached --quiet; then
            git commit -m "HAIR Product READY V2 record live QA evidence"
            git push origin main
          fi
          echo "HAIR PRODUCT READY V2.3 LIVE QA COMPLETE"
