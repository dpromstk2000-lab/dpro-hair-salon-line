name: STEP DPRO-SYSTEMS-10 Hair Salon Operation Demo R2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/step-dpro-systems-10-hair-operation-demo-r2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create and clarify hair salon public operation demo
        shell: python
        run: |
          from pathlib import Path
          import base64
          import re

          official_url = "https://dpro-shop.com/systems/hair"
          portal = base64.b64decode("").decode("utf-8")
          banner = base64.b64decode("").decode("utf-8")
          shared_css = base64.b64decode("").decode("utf-8")
          css_marker = "/* DPRO-SYSTEMS-10 HAIR OPERATION DEMO */"

          screen_files = [
              "index.html",
              "member.html",
              "owner-ipad.html",
              "staff.html",
              "owner.html",
          ]

          body_classes = {
              "index.html": "hair-operation-customer",
              "member.html": "hair-operation-member",
              "owner-ipad.html": "hair-operation-ipad",
              "staff.html": "hair-operation-staff",
              "owner.html": "hair-operation-owner",
          }

          visible_labels = {
              "DPRO NEXT STANDARD": "PUBLIC OPERATION DEMO",
              "DPRO NEXT MEMBER": "PUBLIC OPERATION DEMO",
              "DPRO NEXT STAFF": "PUBLIC OPERATION DEMO",
              "DPRO NEXT RECEPTION": "PUBLIC OPERATION DEMO",
          }

          for filename in screen_files:
              if not Path(filename).exists():
                  raise SystemExit(f"ERROR: required public screen not found: {filename}")

          # 動作用のVERSION系定数を変更前後で比較するため保存
          version_pattern = re.compile(
              r'\\b(?:const|let|var)\\s+[A-Z0-9_]*VERSION[A-Z0-9_]*\\s*=\\s*[^;]+;',
              flags=re.I,
          )
          versions_before = {
              filename: version_pattern.findall(
                  Path(filename).read_text(encoding="utf-8")
              )
              for filename in screen_files
          }

          Path("demo-guide.html").write_text(portal, encoding="utf-8")

          def add_body_classes(text, filename):
              match = re.search(r"<body([^>]*)>", text, flags=re.I)
              if not match:
                  raise SystemExit(f"ERROR: body tag not found: {filename}")

              required = ["hair-operation-demo-page", body_classes[filename]]
              attrs = match.group(1)
              class_match = re.search(r'class="([^"]*)"', attrs)

              if class_match:
                  classes = class_match.group(1).split()
                  for name in required:
                      if name not in classes:
                          classes.append(name)
                  updated_attrs = (
                      attrs[:class_match.start()] +
                      'class="' + " ".join(classes) + '"' +
                      attrs[class_match.end():]
                  )
              else:
                  updated_attrs = attrs + ' class="' + " ".join(required) + '"'

              return text[:match.start()] + "<body" + updated_attrs + ">" + text[match.end():]

          def add_title_label(text, filename):
              match = re.search(r"<title>(.*?)</title>", text, flags=re.I | re.S)
              if not match:
                  raise SystemExit(f"ERROR: title tag not found: {filename}")
              title = match.group(1).strip()
              if "公開操作デモ" in title:
                  return text
              replacement = f"<title>{title}｜公開操作デモ</title>"
              return text[:match.start()] + replacement + text[match.end():]

          def add_demo_meta(text, filename):
              if 'name="robots" content="noindex,nofollow,noarchive"' not in text:
                  head_close = re.search(r"</head>", text, flags=re.I)
                  if not head_close:
                      raise SystemExit(f"ERROR: head closing tag not found: {filename}")
                  meta = (
                      '\n<meta name="robots" content="noindex,nofollow,noarchive">'
                      f'\n<link rel="canonical" href="{official_url}">\n'
                  )
                  text = text[:head_close.start()] + meta + text[head_close.start():]
              elif f'href="{official_url}"' not in text:
                  head_close = re.search(r"</head>", text, flags=re.I)
                  if not head_close:
                      raise SystemExit(f"ERROR: head closing tag not found: {filename}")
                  text = text[:head_close.start()] + f'\n<link rel="canonical" href="{official_url}">\n' + text[head_close.start():]
              return text

          def add_css(text, filename):
              if css_marker in text:
                  return text
              close = re.search(r"</style>", text, flags=re.I)
              if not close:
                  raise SystemExit(f"ERROR: style closing tag not found: {filename}")
              return text[:close.start()] + "\n" + shared_css.strip() + "\n" + text[close.start():]

          def add_banner(text, filename):
              pattern = re.compile(
                  r'<section\b[^>]*class="[^"]*\bhair-operation-demo-banner\b[^"]*"[^>]*>',
                  flags=re.I,
              )
              if pattern.search(text):
                  return text
              body = re.search(r"<body[^>]*>", text, flags=re.I)
              if not body:
                  raise SystemExit(f"ERROR: body tag not found for banner: {filename}")
              return text[:body.end()] + "\n" + banner + "\n" + text[body.end():]

          def remove_system_check_links(text):
              pattern = re.compile(
                  r'<a\b[^>]*href=["\'][^"\']*system-check\.html[^"\']*["\'][^>]*>.*?</a>',
                  flags=re.I | re.S,
              )
              return pattern.sub("", text)

          for filename in screen_files:
              text = Path(filename).read_text(encoding="utf-8")
              text = add_title_label(text, filename)
              text = add_demo_meta(text, filename)
              text = add_body_classes(text, filename)
              text = add_css(text, filename)
              text = add_banner(text, filename)
              text = remove_system_check_links(text)

              for before, after in visible_labels.items():
                  text = text.replace(before, after)

              Path(filename).write_text(text, encoding="utf-8")

          guide = Path("demo-guide.html").read_text(encoding="utf-8")
          assert "公開操作デモ・画面一覧" in guide
          assert "店舗側デモ管理コード：1234" in guide
          assert guide.count('class="card"') == 5
          assert "system-check" not in guide
          assert "営業前" not in guide
          for target in screen_files:
              assert f'href="{target}' in guide

          banner_pattern = re.compile(
              r'<section\b[^>]*class="[^"]*\bhair-operation-demo-banner\b[^"]*"[^>]*>',
              flags=re.I,
          )
          public_check_pattern = re.compile(
              r'<a\b[^>]*href=["\'][^"\']*system-check\.html[^"\']*["\'][^>]*>',
              flags=re.I,
          )

          for filename in screen_files:
              content = Path(filename).read_text(encoding="utf-8")
              title_match = re.search(r"<title>(.*?)</title>", content, flags=re.I | re.S)
              assert title_match and "公開操作デモ" in title_match.group(1), filename
              assert 'name="robots" content="noindex,nofollow,noarchive"' in content, filename
              assert f'<link rel="canonical" href="{official_url}">' in content, filename
              assert "hair-operation-demo-page" in content, filename
              assert body_classes[filename] in content, filename
              assert banner_pattern.search(content), filename
              assert css_marker in content, filename
              assert "demo-guide.html" in content, filename
              assert official_url in content, filename
              assert not public_check_pattern.search(content), filename

          assert "前回と同じ内容で予約" in Path("index.html").read_text(encoding="utf-8")
          assert "マイページを確認" in Path("member.html").read_text(encoding="utf-8")
          assert "店内iPad受付" in Path("owner-ipad.html").read_text(encoding="utf-8")
          assert "スタッフ施術" in Path("staff.html").read_text(encoding="utf-8")
          assert "美容室360°カルテ" in Path("owner.html").read_text(encoding="utf-8")

          # 内部検査画面・共通設定は変更対象外
          assert Path("system-check.html").exists()
          assert Path("config.js").exists()

          # VERSION系定数は、存在の有無や書式ではなく変更前後の一致を検査
          versions_after = {
              filename: version_pattern.findall(
                  Path(filename).read_text(encoding="utf-8")
              )
              for filename in screen_files
          }
          assert versions_after == versions_before, "VERSION系定数が変更されています"

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "dpro-systems-bot"
          git config user.email "actions@users.noreply.github.com"
          git add demo-guide.html index.html member.html owner-ipad.html staff.html owner.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "STEP DPRO-SYSTEMS-10 clarify hair salon operation demo R2"
          git push
