name: HAIR PRODUCT READY V2.6 Align Config and Final Live QA

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/HAIR-PRODUCT-READY-V2.6.yml"

permissions:
  contents: write

concurrency:
  group: hair-product-ready-v26-final
  cancel-in-progress: false

env:
  WORKER_BASE: https://dpro-hair-salon-line-api.dpromstk2000.workers.dev
  PAGE_BASE: https://dpromstk2000-lab.github.io/dpro-hair-salon-line
  EXPECTED_WORKER_VERSION: HAIR-PRODUCT-READY-2.2-WORKER-20260822
  EVIDENCE_DIR: dpro-product-ready/hair/evidence
  WORKFLOW_FILE: .github/workflows/HAIR-PRODUCT-READY-V2.6.yml

jobs:
  finalize-live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current HAIR main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Confirm Product READY Staff source and Config alignment state
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'HAIR-PRODUCT-READY-STAFF-SCOPE-20260822' staff.html
          grep -q 'issueStaffSession' config.js
          grep -q 'staffGet' config.js
          grep -q 'staffPost' config.js
          grep -q 'C().api.issueStaffSession' staff.html
          ! grep -q 'C().api.adminGet' staff.html
          ! grep -q 'C().api.adminPost' staff.html
          python - <<'PY'
          from pathlib import Path
          text=Path('config.js').read_text(encoding='utf-8')
          old='HAIR-PRODUCT-READY-2.1-WORKER-20260822'
          new='HAIR-PRODUCT-READY-2.2-WORKER-20260822'
          if old not in text and new not in text:
              raise SystemExit('Unexpected config.js Worker expectation; refusing unsafe automatic edit.')
          print('Staff source PASS')
          print('Config alignment state:', '2.2 already aligned' if new in text else '2.1 -> 2.2 update required')
          PY

      - name: Verify Worker 2.2 and CORS hotfix
        shell: bash
        run: |
          set -euo pipefail
          BODY=/tmp/hair-worker-health.json
          STATUS="$(curl -sS -L -o "$BODY" -w "%{http_code}" --max-time 30             -A "Mozilla/5.0 DPRO-Hair-Product-Ready/2.6"             -H "Accept: application/json"             -H "Cache-Control: no-cache"             -H "Origin: http://127.0.0.1:5500"             "${WORKER_BASE}/api/health?shop_code=dpro_hair_demo&final_v26=$(date +%s)")"
          test "$STATUS" = "200"
          python - <<'PY'
          import json, os
          data=json.load(open('/tmp/hair-worker-health.json',encoding='utf-8'))
          actual=data.get('version')
          expected=os.environ['EXPECTED_WORKER_VERSION']
          if actual != expected:
              raise SystemExit(f'Worker mismatch: expected {expected}, got {actual}')
          print('Worker version PASS:',actual)
          PY
          ACAO="$(curl -sS -D - -o /dev/null --max-time 30             -H 'Origin: http://127.0.0.1:5500'             -H 'Cache-Control: no-cache'             "${WORKER_BASE}/api/public/config?shop_code=dpro_hair_demo&cors_v26=$(date +%s)"             | tr -d '\r' | awk -F': ' 'tolower($1)=="access-control-allow-origin"{print $2}' | tail -1)"
          echo "CORS ACAO=${ACAO}"
          test "$ACAO" = "http://127.0.0.1:5500"

      - name: Align config.js expected Worker to 2.2 and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('config.js')
          text=p.read_text(encoding='utf-8')
          old='const EXPECTED_WORKER_VERSION = "HAIR-PRODUCT-READY-2.1-WORKER-20260822";'
          new='const EXPECTED_WORKER_VERSION = "HAIR-PRODUCT-READY-2.2-WORKER-20260822";'
          if new in text:
              print('config.js already aligned to Worker 2.2')
          elif old in text:
              if text.count(old) != 1:
                  raise SystemExit('Unsafe config edit: old Worker expectation does not occur exactly once.')
              p.write_text(text.replace(old,new,1),encoding='utf-8')
              print('config.js aligned 2.1 -> 2.2')
          else:
              raise SystemExit('Unsafe config edit: expected Worker marker not found.')
          PY
          grep -q 'HAIR-PRODUCT-READY-2.2-WORKER-20260822' config.js
          git config user.name "DPRO Product READY"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- config.js; then
            git add config.js
            git commit -m "HAIR align frontend expected Worker to Product READY 2.2"
            git push origin main
          fi

      - name: Confirm GitHub Pages Product READY source
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for i in $(seq 1 24); do
            TS="$(date +%s)"
            STAFF="$(curl -fsSL --retry 2 --max-time 25 -A 'Mozilla/5.0 DPRO-Hair-Product-Ready/2.6'               "${PAGE_BASE}/staff.html?ready_v26=${TS}_${i}" || true)"
            CONFIG="$(curl -fsSL --retry 2 --max-time 25 -A 'Mozilla/5.0 DPRO-Hair-Product-Ready/2.6'               "${PAGE_BASE}/config.js?ready_v26=${TS}_${i}" || true)"
            if [[ "$STAFF" == *"HAIR-PRODUCT-READY-STAFF-SCOPE-20260822"* && "$CONFIG" == *"$EXPECTED_WORKER_VERSION"* ]]; then
              READY=1
              echo "GitHub Pages source PASS on attempt $i"
              break
            fi
            echo "GitHub Pages not current yet: attempt $i/24"
            sleep 10
          done
          test "$READY" = "1"

      - name: Install browser QA runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet playwright==1.55.0
          python -m playwright install --with-deps chromium >/tmp/playwright-install.log 2>&1 || {
            cat /tmp/playwright-install.log
            exit 1
          }

